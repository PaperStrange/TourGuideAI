# tourguide-2.5d — DSH bundle patch.
#
# This bundle deliberately mounts NO plugin code. An earlier revision shipped a
# plugin/index.js that imported `@deepseek-ai/dsh-skill-filesystem`, which the
# profile could not resolve: the bundle is installed as a `link:` into the
# workspace, and Node resolution from there never reaches the dsh installation's
# node_modules (the packaged npm version is a stale 0.0.1-rc.3). The skill is
# therefore mounted through CONFIGURATION instead of code.
#
# One `insert` with one row: the `tourguide` agent preset declaration. It inserts
# a NEW preset row and does NOT override `preset-standard` or `preset-cordis`, so
# a mistake here cannot break the presets that already compose.
- insert:
    - id: preset-tourguide
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: tourguide
        name: TourGuide 2.5D
        description: >-
          Fact-integrity preset for the TourGuideAI 2.5D travel-simulation
          reboot: enforces the city-pack provenance contract, the fact/narrative
          separation, and the paid-realism red line.
        order: 20
        plugins:
          # NOTE — do NOT declare a second `@deepseek-ai/dsh-persona` row here.
          #
          # The project rules were originally a separate `persona-tourguide` row.
          # That made this preset fail to load with:
          #   persona (@deepseek-ai/dsh-persona): prompt section
          #   "deployment:persona-prefix" is already registered in this scope
          # because `dsh-persona` registers one fixed prompt section, so two
          # instances collide in the same scope.
          #
          # The rules are therefore folded into the SINGLE `persona` row below,
          # which is where the shipped `standard` preset already puts its prefix.
          #
          # NOTE — do NOT declare a `skill-filesystem` row here.
          #
          # The skill is mounted through the DEFAULT PROJECT ROOT instead:
          # `<projectRoot>/.dsh/skills/tourguide-fact-integrity/SKILL.md`, where
          # projectRoot is the nearest `.git` ancestor. The host's global
          # `skill-filesystem` provider scans it at rank 100 whenever
          # `includeDefaultRoots` is true (the default), so no row is needed.
          #
          # Declaring that row here was an earlier bug: `providerName` defaults to
          # `filesystem`, which the `skills` service documents as unique and which
          # throws on a duplicate name — the same name the host already registered.
          #
          # Mounting it at rank 100 also works in EVERY preset, not just this one,
          # and survives a repo move (no absolute path to keep in sync).

          # ── shipped `standard` list, copied verbatim ──────────────────────────
          # The Loader replaces `config` wholesale, so every row below must be
          # restated: omitting any of them would remove that tool from the
          # session. Copied from @deepseek-ai/dsh-web-app presets/standard.patch.yml.
          #
          # NOTE: @weibaohui/experts-management is intentionally NOT listed here.
          # It is a HOST-PLANE bundle (it registers a host `skills` provider and
          # an HTTP route), already installed and enabled as its own profile
          # bundle, and its own patch says it "must therefore land in the host
          # composition, never inside an agent preset".
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: >-
                You are a coding agent powered by the {{model}} model.

                You are working on the TourGuideAI 2.5D travel-simulation
                reboot. Its output is executed in the real world: the player
                plays in-game, exports a travel guide, follows it in Japan, and
                returns real trip photos into a memoir. Obey these without being
                reminded:
                (1) Facts come only from the city-pack fact layer, each field
                carrying source_url + verified_at. Never author a place, opening
                hour, price, fare, or transit leg from memory or inference.
                (2) Drop, don't correct. When a validation gate rejects content,
                discard it or degrade to a plain deterministic template. Never
                substitute a plausible-looking value.
                (3) No mechanic and no payment may change the in-game time or
                money ledger, because that breaks the equality between in-game
                cost and real cost on which the exported guide depends.
                (4) Reject any feature unrelated to the loop: play -> export
                guide -> travel -> memoir. The previous attempt at this project
                died by accumulating tens of thousands of lines of unrelated
                tooling.
                (5) The harness web_fetch tool is blocked here (hostnames resolve
                to non-public IPs), but curl DOES reach the network with per-host
                results that vary -- platform.openai.com returns 200 while
                en.wikipedia.org times out. Never conclude "no web access" from a
                web_fetch failure: try curl for the specific host, and never
                present a figure you could not retrieve as verified.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
