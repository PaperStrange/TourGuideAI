name: Guided 3D experience

on:
  push:
    paths:
      - 'experience/src/**'
      - 'experience/public/**'
      - 'experience/art/**'
      - 'experience/content-tools/**'
      - 'experience/tools/**'
      - 'experience/tests/**'
      - 'experience/*.html'
      - 'experience/package*.json'
      - 'experience/vite.config.js'
      - '.github/workflows/experience.yml'
  pull_request:
    paths:
      - 'experience/src/**'
      - 'experience/public/**'
      - 'experience/art/**'
      - 'experience/content-tools/**'
      - 'experience/tools/**'
      - 'experience/tests/**'
      - 'experience/*.html'
      - 'experience/package*.json'
      - 'experience/vite.config.js'
      - '.github/workflows/experience.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experience-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate ${{ matrix.suite }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: original walk
            command: test:browser
            output: browser
            artifact: experience-browser-evidence
          - suite: shared perspective
            command: test:perspective
            output: perspective
            artifact: perspective-browser-evidence
    defaults:
      run:
        working-directory: experience
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: experience/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Exercise the packaged experience in Chromium
        run: npm run ${{ matrix.command }} -- dist
        env:
          EXPERIENCE_QA_OUTPUT: test-results/${{ matrix.output }}
          # A bounded tooling allowance for software rendering, not a fluency target.
          EXPERIENCE_QA_TIMEOUT: '600000'
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: experience/test-results/${{ matrix.output }}
          if-no-files-found: ignore
