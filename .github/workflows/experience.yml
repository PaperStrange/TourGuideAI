name: Guided 3D experience

on:
  push:
    paths:
      - 'experience/src/**'
      - 'experience/public/**'
      - 'experience/art/**'
      - 'experience/content-tools/**'
      - 'experience/content/**'
      - 'experience/tools/**'
      - 'experience/tests/**'
      - 'experience/server/**'
      - 'experience/*.html'
      - 'experience/package*.json'
      - 'experience/vite.config.js'
      - '.github/workflows/experience.yml'
  pull_request:
    paths:
      - 'experience/src/**'
      - 'experience/public/**'
      - 'experience/art/**'
      - 'experience/content-tools/**'
      - 'experience/content/**'
      - 'experience/tools/**'
      - 'experience/tests/**'
      - 'experience/server/**'
      - 'experience/*.html'
      - 'experience/package*.json'
      - 'experience/vite.config.js'
      - '.github/workflows/experience.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experience-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geographic-sources:
    runs-on: ubuntu-latest
    name: Validate geographic source preparation
    timeout-minutes: 10
    env:
      TMPDIR: ${{ github.workspace }}/artifacts/tmp
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            experience/content-tools/requirements.txt
            experience/content-tools/shijo-east-requirements.txt
      - run: python -m pip install -r experience/content-tools/shijo-east-requirements.txt
      - name: Verify captured geographic data and prepared surfaces
        run: python experience/tests/site-workbench-test.py
      - name: Verify the connected neighborhood against retained sources
        run: python experience/tests/neighborhood-source-test.py

  validate:
    runs-on: ubuntu-latest
    name: Validate ${{ matrix.suite }}
    timeout-minutes: ${{ matrix.suite == 'connected neighborhood' && 240 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: original walk
            command: test:browser
            output: browser
            artifact: experience-browser-evidence
          - suite: shared perspective
            command: test:perspective
            output: perspective
            artifact: perspective-browser-evidence
          - suite: travel companion
            command: test:travel
            output: travel
            artifact: travel-browser-evidence
          - suite: journey homepage
            command: test:homepage
            output: homepage
            artifact: homepage-browser-evidence
          - suite: solo exploration
            command: test:solo
            output: solo
            artifact: solo-browser-evidence
          - suite: reviewed place packs
            command: test:packs
            output: packs
            artifact: packs-browser-evidence
          - suite: connected neighborhood
            command: test:neighborhood
            output: neighborhood
            artifact: neighborhood-browser-evidence
    env:
      TMPDIR: ${{ github.workspace }}/artifacts/tmp
    defaults:
      run:
        working-directory: experience
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: experience/package-lock.json
      - run: npm ci
      - name: Install and test room service
        if: matrix.suite == 'journey homepage' || matrix.suite == 'solo exploration' || matrix.suite == 'reviewed place packs' || matrix.suite == 'connected neighborhood'
        run: npm ci --prefix server && npm test --prefix server
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Exercise the packaged experience in Chromium
        run: npm run ${{ matrix.command }} -- dist
        env:
          EXPERIENCE_QA_OUTPUT: test-results/${{ matrix.output }}
          # A bounded tooling allowance for software rendering, not a fluency target.
          EXPERIENCE_QA_TIMEOUT: '600000'
          # 软件渲染下完整往返的执行时限；体验性能门槛仍由独立基准验证。
          EXPERIENCE_QA_WALK_TIMEOUT: '2400000'
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: experience/test-results/${{ matrix.output }}
          if-no-files-found: ignore
      - name: Walk through both homepage journeys
        if: matrix.suite == 'journey homepage'
        run: npm run test:walkthrough -- dist
        env:
          EXPERIENCE_QA_FRONTEND: packaged
          EXPERIENCE_QA_OUTPUT: test-results/walkthrough
          EXPERIENCE_QA_TIMEOUT: '120000'
      - name: Preserve walkthrough evidence
        if: always() && matrix.suite == 'journey homepage'
        uses: actions/upload-artifact@v4
        with:
          name: homepage-walkthrough-evidence
          path: experience/test-results/walkthrough
          if-no-files-found: ignore
