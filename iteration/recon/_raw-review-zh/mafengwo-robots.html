        <script>
            var seqid = "4a3bc75a081c56f7e9155c8a9ae7c15cf1257b29229d5eb1647e02a0e11cb3d261d5d393894f10707a4f30697a7f8400a437bfd411543f99da05f4d5b941b8c480d60dc15e112cf758caf4724c5456191be7fb93e79e790d164cdb5e799276dc__captcha"
        </script>
        <script src="https://ssl.captcha.qq.com/TCaptcha.js"></script>
        <script>
            var captcha = new TencentCaptcha('2017163193', function(res){
                var captchaResult = []
                captchaResult.push(res.ret)

                if(res.ret === 0){
                    captchaResult.push(res.ticket)
                    captchaResult.push(res.randstr)
                    captchaResult.push(seqid)
                }

                var content = captchaResult.join('\n')
                loadXMLDoc("/WafCaptcha", content)
            })

            function loadXMLDoc(servPath, content) {
                var xmlhttp = null;
                if (window.XMLHttpRequest) {
                    xmlhttp = new XMLHttpRequest();
                }
                else if (window.ActiveXObject) {
                    xmlhttp = new ActiveXObject("Microsoft.XMLHTTP");
                }

                if (xmlhttp != null) {
                    xmlhttp.open("POST", servPath, true);
                    xmlhttp.send(content);
                    xmlhttp.onreadystatechange = function() {
                        if (xmlhttp.readyState == 4) {
                            if (xmlhttp.status == 200) {
                                window.location.reload(true)
                            }
                        }
                    }
                }
            }

            captcha.show()

        </script>
