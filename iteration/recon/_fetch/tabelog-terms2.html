ndleScroll);\n          window.addEventListener('resize', updateHeights);\n          handleScroll();\n          \n          return true; \u002F\u002F 初期化成功\n      }\n      \n      \u002F\u002F ヘッダー追従機能の初期化\n      function initializeStickyHeader() {\n          if (window.studioDesignStickyHeaderInitialized) return;\n          \n          try {\n              if (initStickyHeader()) {\n                  window.studioDesignStickyHeaderInitialized = true;\n              }\n          } catch (error) {\n              \u002F\u002F エラーハンドリング（ログ出力なし）\n          }\n      }\n      \n      \u002F\u002F DOM変化監視（ヘッダー関連）\n      function setupStickyHeaderObserver() {\n          const header = document.getElementById('header');\n          if (!header) return null;\n          \n          const headerObserver = new MutationObserver((mutations) => {\n              let shouldInitialize = false;\n              \n              mutations.forEach((mutation) => {\n                  if (mutation.type === 'childList' && mutation.addedNodes.length > 0) {\n                      const hasHeaderElements = Array.from(mutation.addedNodes).some(node => {\n                          return node.nodeType === Node.ELEMENT_NODE && node.id && (\n                              node.id === 'header' || node.id === 'grad-line'\n                          );\n                      });\n                      if (hasHeaderElements) shouldInitialize = true;\n                  }\n                  \n                  if (mutation.type === 'attributes' && mutation.attributeName === 'id') {\n                      const target = mutation.target;\n                      if (target.id && (\n                          target.id === 'header' || target.id === 'grad-line'\n                      )) {\n                          shouldInitialize = true;\n                      }\n                  }\n              });\n              \n              if (shouldInitialize) {\n                  window.studioDesignStickyHeaderInitialized = false;\n                  setTimeout(() => initializeStickyHeader(), 1000);\n              }\n          });\n          \n          headerObserver.observe(header, {\n              childList: true, subtree: true, attributes: true, attributeFilter: ['id', 'class']\n          });\n          \n          return headerObserver;\n      }\n      \n      \u002F\u002F ヘッダー要素の存在チェック\n      const hasHeaderElements = () => {\n          const header = document.getElementById('header');\n          return !!header;\n      };\n\n      \u002F\u002F 初期化実行\n      const executeStickyHeaderInitialization = () => {\n          if (window.studioDesignStickyHeaderInitialized) return;\n          \n          \u002F\u002F ヘッダー要素が存在しない場合は早期終了\n          if (!hasHeaderElements()) {\n              return;\n          }\n          \n          initializeStickyHeader();\n          if (!window.studioDesignStickyHeaderObserver) {\n              window.studioDesignStickyHeaderObserver = setupStickyHeaderObserver();\n          }\n      };\n\n      const handlePageChange = () => {\n          window.studioDesignStickyHeaderInitialized = false;\n          setTimeout(() => executeStickyHeaderInitialization(), 1000);\n      };\n\n      window.addEventListener('popstate', handlePageChange);\n\n      const originalPushState = history.pushState;\n      const originalReplaceState = history.replaceState;\n\n      history.pushState = function() {\n          originalPushState.apply(history, arguments);\n          handlePageChange();\n      };\n\n      history.replaceState = function() {\n          originalReplaceState.apply(history, arguments);\n          handlePageChange();\n      };\n\n      const initOnDOMReady = () => {\n          if (document.readyState === 'loading') {\n              document.addEventListener('DOMContentLoaded', executeStickyHeaderInitialization);\n          } else {\n              executeStickyHeaderInitialization();\n          }\n      };\n\n      initOnDOMReady();\n\n      window.addEvent self.validateForm();\n          self.validateEmail();\n        });\n        this.emailInput.addEventListener(\"blur\", () => self.validateEmail());\n      }\n\n      this.form.addEventListener(\"submit\", (e) => {\n        if (!self.validateForm()) {\n          e.preventDefault();\n          e.stopPropagation();\n          self.scrollToFirstError();\n          return false;\n        }\n      });\n\n      const handleDisabledClick = (e) => {\n        if (this.submitButton.disabled) {\n          e.preventDefault();\n          e.stopPropagation();\n          self.scrollToFirstError();\n          return false;\n        }\n      };\n\n      this.submitButton.addEventListener(\"click\", handleDisabledClick);\n      [\"mousedown\", \"mouseup\", \"touchend\", \"pointerdown\"].forEach(\n        (eventType) => {\n          this.submitButton.addEventListener(eventType, handleDisabledClick);\n        }\n      );\n    },\n\n    validateForm: function () {\n      let isValid = true;\n\n      for (let i = 0; i \u003C this.requiredFields.length; i++) {\n        const field = this.requiredFields[i];\n\n        if (field.type === \"checkbox\") {\n          if (!field.checked) {\n            isValid = false;\n            break;\n          }\n        } else if (field.tagName === \"SELECT\") {\n          if (!field.value || field.value === \"\" || field.value === \"0\") {\n            isValid = false;\n            break;\n          }\n        } else {\n          if (!field.value.trim()) {\n            isValid = false;\n            break;\n          }\n        }\n      }\n\n      if (this.emailInput && isValid) {\n        const emailValue = this.emailInput.value.trim();\n        if (!emailValue || !this.isValidEmail(emailValue)) {\n          isValid = false;\n        }\n      }\n\n      this.updateSubmitButton(isValid);\n      return isValid;\n    },\n\n    validateEmail: function () {\n      const email = this.emailInput.value.trim();\n\n      if (!email) {\n        this.showEmailError(\"メールアドレスを入力してください。\");\n        return false;\n      }\n\n      if (!this.isValidEmail(email)) {\n        this.showEmailError(\n          \"有効なメールアドレスを入力してください。（例：user@example.com）\"\n        );\n        return false;\n      }\n\n      this.clearEmailError();\n      return true;\n    },\n\n    isValidEmail: function (email) {\n      const emailRegex =\n        \u002F^[a-zA-Z0-9.!#$%&'*+\u002F=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$\u002F;\n\n      if (!emailRegex.test(email)) return false;\n\n      const parts = email.split(\"@\");\n      if (parts.length !== 2) return false;\n\n      const domain = parts[1];\n      const domainParts = domain.split(\".\");\n\n      if (domainParts.length \u003C 2) return false;\n\n      const tld = domainParts[domainParts.length - 1];\n      if (tld.length \u003C 2) return false;\n\n      const domainRegex = \u002F^[a-zA-Z0-9.-]+$\u002F;\n      return domainRegex.test(domain);\n    },\n\n    showEmailError: function (message) {\n      if (this.emailErrorDiv) {\n        this.emailErrorDiv.textContent = message;\n        this.emailErrorDiv.style.color = \"#ff0000\";\n        this.emailErrorDiv.style.fontSize = \"14px\";\n        this.emailErrorDiv.style.marginTop = \"5px\";\n      }\n    },\n\n    clearEmailError: function () {\n      if (this.emailErrorDiv) this.emailErrorDiv.textContent = \"\";\n    },\n\n    updateSubmitButton: function (isValid) {\n      if (!this.submitButton) return;\n\n      if (isValid) {\n        Object.assign(this.submitButton, {\n          disabled: false,\n          style: Object.assign(this.submitButton.style, {\n            background: \"#2D2D2D\",\n            color: \"#FFFFFF\",\n            cursor: \"pointer\",\n            borderColor: \"#2D2D2D\",\n          }),\n        });\n        this.submitButton.classList.add(\"enabled\");\n        this.submitButton.classList.remove(\"disabled\");\n      } else {\n        Object.assign(th e, options) {\n        var element = typeof iframe === 'string' ? document.querySelector(iframe) : iframe;\n        \n        if (!element || element.tagName.toLowerCase() !== 'iframe') {\n          console.error('Invalid iframe element provided');\n          return false;\n        }\n        \n        \u002F\u002F 個別オプションをマージ\n        var mergedOptions = {};\n        for (var key in this.options) {\n          if (this.options.hasOwnProperty(key)) {\n            mergedOptions[key] = this.options[key];\n          }\n        }\n        if (options) {\n          for (var key in options) {\n            if (options.hasOwnProperty(key)) {\n              mergedOptions[key] = options[key];\n            }\n          }\n        }\n        \n        \u002F\u002F CSSトランジションを設定\n        element.style.transition = 'height ' + mergedOptions.transitionDuration;\n        \n        \u002F\u002F 管理対象に追加\n        this.managedIframes.set(element, mergedOptions);\n        \n        if (this.options.debug) {\n          console.log('Added iframe to management', element, mergedOptions);\n        }\n        \n        return true;\n      },\n      \n      \u002F**\n        * iframeを管理対象から削除\n        * @param {HTMLIFrameElement|string} iframe iframeエレメントまたはセレクタ\n        *\u002F\n      removeIframe: function(iframe) {\n        var element = typeof iframe === 'string' ? document.querySelector(iframe) : iframe;\n        \n        if (this.managedIframes.has(element)) {\n          this.managedIframes.delete(element);\n          element.style.transition = '';\n          \n          if (this.options.debug) {\n            console.log('Removed iframe from management', element);\n          }\n          \n          return true;\n        }\n        \n        return false;\n      },\n      \n      \u002F**\n        * postMessageを処理\n        * @param {MessageEvent} event \n        *\u002F\n      handleMessage: function(event) {\n        \u002F\u002F メッセージの形式をチェック\n        if (!event.data || typeof event.data !== 'object' || event.data.type !== 'iframe-height') {\n          return;\n        }\n        \n        var height = event.data.height;\n        var origin = event.data.origin;\n        \n        if (typeof height !== 'number' || height \u003C 0) {\n          if (this.options.debug) {\n            console.warn('Invalid height received:', height);\n          }\n          return;\n        }\n        \n        \u002F\u002F オリジンチェック\n        if (!this.isOriginAllowed(event.origin)) {\n          if (this.options.debug) {\n            console.warn('Message from disallowed origin:', event.origin);\n          }\n          return;\n        }\n        \n        \u002F\u002F 送信元iframeを特定\n        var targetIframe = this.findTargetIframe(event.source);\n        \n        if (targetIframe && this.managedIframes.has(targetIframe)) {\n          this.resizeIframe(targetIframe, height);\n        } else if (this.options.debug) {\n          console.warn('Target iframe not found or not managed');\n        }\n      },\n      \n      \u002F**\n        * オリジンが許可されているかチェック\n        * @param {string} origin \n        * @returns {boolean}\n        *\u002F\n      isOriginAllowed: function(origin) {\n        var allowedOrigins = this.options.allowedOrigins;\n        \n        if (allowedOrigins.indexOf('*') !== -1) {\n          return true;\n        }\n        \n        for (var i = 0; i \u003C allowedOrigins.length; i++) {\n          if (allowedOrigins[i] === origin) {\n            return true;\n          }\n        }\n        \n        return false;\n      },\n      \n      \u002F**\n        * メッセージの送信元iframeを特定\n        * @param {Window} source \n        * @returns {HTMLIFrameElement|null}\n        *\u002F\n      findTargetIframe: function(source) {\n        var iframes = this.managedIframes.keys();\n        var iframe;\n        \n        while (!(iframe = iframes.next()).done) {\n          iframe = iframe.value;\n          if (iframe.contentWindow === source) {\n            return iframe;\n          }\n        }\n        \n        return null;\n      },\n      \n      \u002F**\n        * iframeのサイズを変更\n        * @param {HTMLIFrameElement} iframe \n        * @param {number} height \n        *\u002F\n      resizeIframe: function(iframe, height) {\n        var options = this.managedIframes.get(iframe);\n        var currentHeight = parseInt(iframe.style.height) || 0;\n        \n        \u002F\u002F 高さの調整\n        var adjustedHeight = height + options.padding;\n        \n        \u002F\u002F 最小高さ・最大高さの制限\n        if (adjustedHeight \u003C options.minHeight) {\n          adjustedHeight = options.minHeight;\n        }\n        \n        if (options.maxHeight && adjustedHeight > options.maxHeight) {\n          adjustedHeight = options.maxHeight;\n        }\n        \n        \u002F\u002F 現在の高さと比較して、大きな変化がある場合のみ更新（5px以上の差）\n        if (Math.abs(adjustedHeight - currentHeight) >= 5) {\n          \u002F\u002F 高さを設定\n          iframe.style.height = adjustedHeight + 'px';\n          \n          if (options.debug) {\n            console.log('Resized iframe:', iframe, 'from:', currentHeight, 'to:', adjustedHeight);\n          }\n          \n          \u002F\u002F カスタムイベントを発火\n          if (window.CustomEvent) {\n            var event = new CustomEvent('iframeResized', {\n              detail: {\n                iframe: iframe,\n                height: adjustedHeight,\n                originalHeight: height,\n                previousHeight: currentHeight\n              }\n            });\n            document.dispatchEvent(event);\n          }\n        } else if (options.debug) {\n          console.log('Height change too small, skipping resize:', Math.abs(adjustedHeight - currentHeight), 'px');\n        }\n      },\n      \n      \u002F**\n        * 全ての管理対象iframeに高さリセットを要求\n        *\u002F\n      requestHeightUpdate: function() {\n        var iframes = this.managedIframes.keys();\n        var iframe;\n        \n        while (!(iframe = iframes.next()).done) {\n       [id^=\"scroll-bar-\"]::-webkit-scrollbar {\n                height: 8px;\n            }\n            [id^=\"scroll-bar-\"]::-webkit-scrollbar-track {\n                background: #f5f5f5;\n                border-radius: 4px;\n            }\n            [id^=\"scroll-bar-\"]::-webkit-scrollbar-thumb {\n                background: #ccc;\n                border-radius: 4px;\n            }\n            [id^=\"scroll-bar-\"]::-webkit-scrollbar-thumb:hover {\n                background: #999;\n            }\n            \n            \u002F* ツールチップの位置設定 *\u002F\n            #tooltip, [id^=\"tooltip-\"] {\n                position: absolute !important;\n                top: 50% !important;\n                left: 50% !important;\n                transform: translate(-50%, -50%) !important;\n                z-index: 10000 !important;\n                pointer-events: none !important;\n                transition: all 0.3s ease !important;\n            }\n            \n            \u002F* PC・タブレットサイズでtooltip-1, tooltip-2を非表示 *\u002F\n            @media (min-width: 768px) {\n                #tooltip-1, #tooltip-2 {\n                    display: none !important;\n                    visibility: hidden !important;\n                    opacity: 0 !important;\n                }\n            }\n        `;\n    document.head.appendChild(style);\n  }\n\n  \u002F\u002F ツールチップの非表示処理\n  function hideTooltip(tooltip) {\n    if (tooltip) {\n      tooltip.style.display = \"none\";\n      tooltip.style.visibility = \"hidden\";\n      tooltip.style.opacity = \"0\";\n      tooltip.style.transform = \"translate(-50%, -50%) scale(0.8)\";\n    }\n  }\n\n  \u002F\u002F 画面サイズをチェックする関数\n  function isMobileSize() {\n    return window.innerWidth \u003C 768;\n  }\n\n  \u002F\u002F ツールチップの表示処理\n  function showTooltip(tooltip) {\n    if (tooltip) {\n      \u002F\u002F tooltip-1, tooltip-2はPC・タブレットサイズでは表示しない\n      if ((tooltip.id === 'tooltip-1' || tooltip.id === 'tooltip-2') && !isMobileSize()) {\n
